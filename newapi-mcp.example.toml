# newapi-mcp 配置文件示例
# 用法: newapi-mcp --config /path/to/newapi-mcp.toml
# 优先级: 内置默认值 < 本文件 < 环境变量 (NEWAPI_BASE_URL / NEWAPI_TOKEN / NEWAPI_WRITEMODE / NEWAPI_TIMEOUT)

[newapi]
# 网关地址（必填，无尾斜杠）
base_url = "https://newapi.ashou.site"

# 面板 PAT（个人设置 → 系统访问令牌）。
# 建议留空并用 token_file 间接引用，避免密钥写进配置文件本体：
# token = ""
token_file = "/home/radxa/.dsh/newapi.pat"

# 工具档位: read(8 只读) / ops(+6 写操作) / admin(+3 渠道 CRUD)
writemode = "ops"

# 上游 HTTP 超时秒数
timeout_seconds = 10
